# Machine-specific settings. Tool values are either a name found on PATH or a full path.
[tools]
blender = 'E:\blander\blender.exe'
ffmpeg = "ffmpeg"
ffprobe = "ffprobe"

[paths]
# Folder containing whitebox.py (the Blender white-model helper library).
whitebox_scripts = 'C:\Users\kakssjs\.claude\skills\blender-whitebox\scripts'
# Source folder of Depth Anything 3 (a clone of github.com/ByteDance-Seed/Depth-Anything-3),
# relative to this file.
depth_anything_3 = '_vendor/Depth-Anything-3/src'

# Upload limits. Render time scales with duration x resolution.
[limits]
max_upload_mb = 200
max_duration_s = 60
max_width = 1920
max_height = 1080
